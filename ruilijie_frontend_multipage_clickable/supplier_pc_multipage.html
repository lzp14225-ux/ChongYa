<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>供应商端 PC 多页面可点击原型</title><style>
:root{--bg:#f1f5f9;--panel:#fff;--line:#dbe3ee;--text:#020617;--muted:#64748b;--dark:#020617;--blue:#2563eb;--green:#059669;--red:#e11d48;--amber:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.page{min-height:100vh;padding:0;background:#f8fafc}
.shell{height:100vh;background:#fff;display:flex;overflow:hidden}
.sidebar{width:255px;background:#020617;color:white;padding:22px 12px;flex-shrink:0}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px 26px}
.logo{width:42px;height:42px;border-radius:16px;background:#2563eb;display:flex;align-items:center;justify-content:center;color:white;font-weight:900}
.logo.green{background:#059669}.logo.orange{background:#f97316}
.brand-title{font-weight:900;font-size:18px}.brand-sub{font-size:13px;color:#cbd5e1;margin-top:4px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{width:100%;border:0;background:transparent;color:#e2e8f0;text-align:left;border-radius:16px;padding:13px 16px;font-weight:700;font-size:14px}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu button.active{background:white;color:#020617}
.main{flex:1;min-width:0;background:#f8fafc;overflow:auto}
.header{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.title{font-size:26px;font-weight:900}.sub{font-size:14px;color:var(--muted);margin-top:5px}
.header-actions{display:flex;gap:12px;align-items:center}
.search{height:44px;width:300px;border:1px solid var(--line);background:#f8fafc;border-radius:16px;color:#94a3b8;display:flex;align-items:center;padding:0 14px;font-size:14px}
.icon-btn{height:44px;min-width:44px;border:1px solid var(--line);border-radius:16px;background:white;display:flex;align-items:center;justify-content:center;font-weight:800}
.content{padding:28px 32px 40px}
.cards{display:grid;gap:18px;margin-bottom:26px}.cards.four{grid-template-columns:repeat(4,1fr)}.cards.three{grid-template-columns:repeat(3,1fr)}.cards.six{grid-template-columns:repeat(6,1fr)}
.card{background:white;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 8px 24px rgba(15,23,42,.04)}
.card.click{transition:.18s;text-align:left}.card.click:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(15,23,42,.09)}
.card-title{font-size:14px;color:var(--muted)}.card-value{font-size:38px;font-weight:900;margin-top:12px}
.pill{display:inline-flex;border:1px solid;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.pill.info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.pill.warn{background:#fffbeb;color:#b45309;border-color:#fde68a}.pill.danger{background:#fff1f2;color:#be123c;border-color:#fecdd3}.pill.success{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.pill.gray{background:#f8fafc;color:#475569;border-color:#e2e8f0}
.grid-2{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.grid-half{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.section-title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.section-title h2{margin:0;font-size:21px}.section-title p{margin:6px 0 0;color:var(--muted);font-size:14px}
.primary{border:0;background:#020617;color:white;border-radius:16px;padding:10px 16px;font-weight:900}.primary.green{background:#059669}.primary.blue{background:#2563eb}.primary.red{background:#e11d48}
.secondary{border:1px solid var(--line);background:white;color:#334155;border-radius:16px;padding:9px 14px;font-weight:800}
.state-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.state{border:0;background:#f8fafc;border-radius:18px;padding:18px;text-align:center}.state:hover{background:#eef2ff}.state b{font-size:26px}
.table-wrap{overflow:hidden;border:1px solid #e2e8f0;border-radius:20px;background:white}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:#f8fafc;color:#64748b;text-align:left;padding:14px 16px;font-weight:900}td{border-top:1px solid #f1f5f9;padding:15px 16px}tbody tr{cursor:pointer}tbody tr:hover{background:#f8fafc}
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:white;border-radius:16px;padding:10px 14px;color:#64748b}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{border:1px solid #e2e8f0;background:#f8fafc;border-radius:16px;padding:12px}.field label{display:block;font-size:12px;color:#64748b;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:0;background:transparent;outline:0;font-weight:800}.field.full{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:12px}.list-item{background:#f8fafc;border:0;border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}.list-item:hover{background:#eef2ff}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.lane{background:#f8fafc;border:1px solid #e2e8f0;border-radius:22px;padding:14px}.lane h3{margin:0 0 12px}.mini-card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{border:1px solid #e2e8f0;background:white;border-radius:999px;padding:10px 16px;font-weight:800}.tab.active{background:#020617;color:white}
.toast{position:fixed;left:50%;top:22px;z-index:99;transform:translateX(-50%);background:#020617;color:white;padding:12px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(15,23,42,.22);display:none;font-size:14px}.toast.show{display:block}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:80}.modal-mask.show{display:flex}
.modal{width:620px;max-width:calc(100vw - 40px);background:white;border-radius:28px;padding:24px;box-shadow:0 24px 80px rgba(15,23,42,.28)}.modal h2{margin:0 0 8px}.modal p{color:#64748b;line-height:1.7}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.drawer{position:fixed;right:-560px;top:0;height:100vh;width:540px;background:white;box-shadow:-20px 0 60px rgba(15,23,42,.25);z-index:90;transition:.25s;padding:26px;overflow:auto}.drawer.show{right:0}.drawer-row{display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9;padding:13px 0;font-size:14px}
.empty{height:320px;border:2px dashed #dbe3ee;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#94a3b8;background:white}
</style></head><body><div id="root"></div><script>
const $ = id => document.getElementById(id);
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2200)}
function setActive(key){document.querySelectorAll(".menu button").forEach(b=>b.classList.toggle("active",b.dataset.page===key))}
function openModal(title,body,ok="确认"){ $("modalTitle").innerHTML=title; $("modalBody").innerHTML=body; $("modalOk").textContent=ok; $("modal").classList.add("show"); $("modalOk").onclick=()=>{closeModal();toast(ok+"成功")} }
function closeModal(){ $("modal").classList.remove("show") }
function openDrawer(title, rows, actions=""){ $("drawerTitle").innerHTML=title; $("drawerBody").innerHTML=rows.map(r=>`<div class="drawer-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")+actions; $("drawer").classList.add("show") }
function closeDrawer(){ $("drawer").classList.remove("show") }
function searchBox(){openModal("搜索结果","<p>模拟搜索到：采购订单 PO20260508001、送货单 DL20260508001、供应商 上海拓明材料。</p>","打开结果")}
function modalShell(){return `<div id="toast" class="toast"></div><div id="modal" class="modal-mask" onclick="if(event.target.id==='modal')closeModal()"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button id="modalOk" class="primary">确认</button></div></div></div><div id="drawer" class="drawer"><button class="secondary" onclick="closeDrawer()" style="float:right">关闭</button><h2 id="drawerTitle"></h2><p class="muted">这里是模拟详情抽屉，可展示状态流、操作记录和下一步动作。</p><div id="drawerBody"></div></div>`}

const pages={
dashboard:{title:"供应商工作台",sub:"报价、接单、送货、退货与对账协同",html:`
<div class="cards six"><button class="card click" onclick="render('quote')"><div class="card-title">待报价</div><div class="card-value">6</div><span class="pill warn">待办</span></button><button class="card click" onclick="render('order')"><div class="card-title">待确认订单</div><div class="card-value">9</div><span class="pill danger">待办</span></button><button class="card click" onclick="render('delivery')"><div class="card-title">待发货</div><div class="card-value">14</div><span class="pill info">待办</span></button><button class="card click" onclick="render('delivery')"><div class="card-title">送货中</div><div class="card-value">8</div><span class="pill info">跟踪</span></button><button class="card click" onclick="render('return')"><div class="card-title">待处理退货</div><div class="card-value">2</div><span class="pill danger">待办</span></button><button class="card click" onclick="render('recon')"><div class="card-title">待确认对账</div><div class="card-value">3</div><span class="pill success">待办</span></button></div>
<div class="grid-half"><div class="card"><h2>待确认订单</h2><div class="list"><button class="list-item" onclick="orderDetail('PO20260508001')"><span>PO20260508001 · 冷轧钢板 SPCC</span><span class="pill warn">待确认</span></button><button class="list-item" onclick="orderDetail('PO20260508005')"><span>PO20260508005 · 镀锌板 DX51D</span><span class="pill warn">待确认</span></button></div></div><div class="card"><h2>下一步建议</h2><p class="muted">14 个订单可创建送货单。请优先处理今日到期订单。</p><button class="primary green" onclick="render('delivery')">立即创建送货单</button></div></div>`},
quote:{title:"询价报价",sub:"待报价、已报价和报价历史",html:`<div class="toolbar"><button class="primary green" onclick="openModal('提交报价','<div class=&quot;form-grid&quot;><div class=&quot;field&quot;><label>单价</label><input value=&quot;8.20&quot;></div><div class=&quot;field&quot;><label>交期</label><input value=&quot;5 天&quot;></div><div class=&quot;field&quot;><label>MOQ</label><input value=&quot;200 KG&quot;></div></div>','提交报价')">立即报价</button><button class="secondary" onclick="toast('已上传报价附件')">上传附件</button></div><div class="table-wrap"><table><thead><tr><th>询价单</th><th>物料</th><th>数量</th><th>截止时间</th><th>状态</th><th>操作</th></tr></thead><tbody><tr onclick="openDrawer('询价单 INQ20260508001',[['物料','冷轧钢板 SPCC'],['数量','200 KG'],['截止','2026-05-10']])"><td><b>INQ20260508001</b></td><td>冷轧钢板 SPCC</td><td>200 KG</td><td>2026-05-10</td><td><span class="pill warn">待报价</span></td><td><button class="primary green" onclick="event.stopPropagation();openModal('提交报价','<p>填写报价、交期、MOQ、付款条件和附件。</p>','提交报价')">报价</button></td></tr></tbody></table></div>`},
order:{title:"订单确认",sub:"确认订单、申请变更或拒绝接单",html:`<div class="toolbar"><button class="primary green" onclick="toast('已批量确认订单')">批量确认</button><button class="secondary" onclick="toast('已导出订单')">导出</button></div><div class="table-wrap"><table><thead><tr><th>订单号</th><th>物料</th><th>数量</th><th>交期</th><th>送货模式</th><th>状态</th><th>操作</th></tr></thead><tbody><tr onclick="orderDetail('PO20260508001')"><td><b>PO20260508001</b></td><td>冷轧钢板 SPCC</td><td>200 KG</td><td>2026-05-12</td><td>送瑞利杰仓库</td><td><span class="pill warn">待确认</span></td><td><button class="primary green" onclick="event.stopPropagation();toast('订单已确认')">确认</button></td></tr></tbody></table></div>`},
delivery:{title:"送货管理",sub:"创建送货单、上传物流和查看签收",html:`<div class="grid-half"><div class="card"><h2>创建送货单</h2><div class="form-grid"><div class="field"><label>订单号</label><input value="PO20260508001"></div><div class="field"><label>本次送货数量</label><input value="200 KG"></div><div class="field"><label>预计到货</label><input value="2026-05-12 10:00"></div><div class="field"><label>物流公司</label><input value="顺丰"></div><div class="field"><label>车牌号</label><input value="沪A12345"></div><div class="field"><label>送货模式</label><select><option>送瑞利杰仓库</option><option>送外库</option><option>送分切厂</option></select></div></div><br/><button class="primary green" onclick="toast('送货单 DL20260508018 已创建')">提交送货单</button></div><div class="card"><h2>签收结果</h2><div class="list"><button class="list-item" onclick="openDrawer('签收结果 DL20260508009',[['送货数量','200 KG'],['签收数量','195 KG'],['差异','短缺 5 KG']])"><span>DL20260508009 · 短缺 5 KG</span><span class="pill danger">差异</span></button><button class="list-item"><span>DL20260508011 · 已入库</span><span class="pill success">完成</span></button></div></div></div>`},
process:{title:"加工分切",sub:"加工反馈、分切反馈和产出记录",html:`<div class="table-wrap"><table><thead><tr><th>任务号</th><th>输入物料</th><th>输出物料</th><th>数量</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td><b>CUT20260508001</b></td><td>卷料 A</td><td>规格 B/C</td><td>500 KG</td><td><span class="pill info">待反馈</span></td><td><button class="primary green" onclick="openModal('分切反馈','<p>录入产出数量、损耗和照片。</p>','提交反馈')">反馈</button></td></tr></tbody></table></div>`},
return:{title:"退货处理",sub:"确认退货、填写接收结果和上传凭证",html:`<div class="table-wrap"><table><thead><tr><th>退货单</th><th>原送货单</th><th>物料</th><th>原因</th><th>状态</th><th>操作</th></tr></thead><tbody><tr onclick="openDrawer('退货单 RT20260508001',[['原送货单','DL20260507009'],['原因','包装破损'],['退货数量','20 PCS']])"><td><b>RT20260508001</b></td><td>DL20260507009</td><td>包材纸箱</td><td>包装破损</td><td><span class="pill danger">待确认</span></td><td><button class="primary green" onclick="event.stopPropagation();toast('已确认接收退货')">确认接收</button></td></tr></tbody></table></div>`},
recon:{title:"对账确认",sub:"待确认对账、已确认对账和差异处理",html:`<div class="table-wrap"><table><thead><tr><th>对账单</th><th>周期</th><th>数量</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td><b>REC202605</b></td><td>2026-05</td><td>12 单</td><td>¥82,600</td><td><span class="pill warn">待确认</span></td><td><button class="primary green" onclick="toast('对账已确认')">确认</button></td></tr></tbody></table></div>`},
profile:{title:"企业资料",sub:"维护联系人、地址、资质和供货范围",html:`<div class="grid-half"><div class="card"><h2>企业信息</h2><div class="form-grid"><div class="field"><label>供应商名称</label><input value="上海拓明材料"></div><div class="field"><label>联系人</label><input value="张经理"></div><div class="field"><label>电话</label><input value="13800000000"></div><div class="field full"><label>发货地址</label><input value="上海市青浦区 XX 路"></div></div><br/><button class="primary green">保存资料</button></div><div class="card"><h2>资质附件</h2><div class="list"><button class="list-item">营业执照<span class="pill success">有效</span></button><button class="list-item">质量认证<span class="pill warn">30 天后到期</span></button></div></div></div>`}
};
const menus=[["dashboard","📊 工作台"],["quote","📄 询价报价"],["order","✅ 订单确认"],["delivery","🚚 送货管理"],["process","🏭 加工分切"],["return","↩️ 退货处理"],["recon","🧾 对账确认"],["profile","🏢 企业资料"]];
function orderDetail(no){openDrawer("订单 "+no,[["物料","冷轧钢板 SPCC"],["数量","200 KG"],["交期","2026-05-12"],["送货模式","送瑞利杰仓库"]],"<div class='actions'><button class='primary green' onclick='toast(\"订单已确认\")'>确认订单</button><button class='secondary' onclick='openModal(\"申请变更\",\"<p>填写变更原因和新交期。</p>\",\"提交变更\")'>申请变更</button></div>")}
function render(key){const p=pages[key]||pages.dashboard;setActive(key);$("pageTitle").textContent=p.title;$("pageSub").textContent=p.sub;$("content").innerHTML=p.html}
function app(){document.getElementById("root").innerHTML=modalShell()+`<div class="page"><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo green">S</div><div><div class="brand-title">供应商门户</div><div class="brand-sub">上海拓明材料</div></div></div><div class="menu">${menus.map(m=>`<button data-page="${m[0]}" onclick="render('${m[0]}')">${m[1]}</button>`).join("")}</div></aside><main class="main"><header class="header"><div><div id="pageTitle" class="title"></div><div id="pageSub" class="sub"></div></div><div class="header-actions"><button class="search" onclick="searchBox()">🔍 搜索询价、订单、送货单</button><button class="icon-btn" onclick="openModal('消息通知','<p>你有 9 个待确认订单、14 个待发货订单。</p>','全部已读')">🔔</button></div></header><section id="content" class="content"></section></main></div></div>`;render("dashboard")}
app();
</script></body></html>
