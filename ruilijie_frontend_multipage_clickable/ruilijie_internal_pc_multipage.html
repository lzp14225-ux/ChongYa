<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>瑞利杰内部端 PC 多页面可点击原型</title><style>
:root{--bg:#f1f5f9;--panel:#fff;--line:#dbe3ee;--text:#020617;--muted:#64748b;--dark:#020617;--blue:#2563eb;--green:#059669;--red:#e11d48;--amber:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.page{min-height:100vh;padding:0;background:#f8fafc}
.shell{height:100vh;background:#fff;display:flex;overflow:hidden}
.sidebar{width:255px;background:#020617;color:white;padding:22px 12px;flex-shrink:0}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px 26px}

.menu{display:flex;flex-direction:column;gap:8px}

.menu button:hover{background:rgba(255,255,255,.08)}
.menu button.active{background:white;color:#020617}
.main{flex:1;min-width:0;background:#f8fafc;overflow:auto}
.header{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.title{font-size:26px;font-weight:900}.sub{font-size:14px;color:var(--muted);margin-top:5px}
.header-actions{display:flex;gap:12px;align-items:center}
.search{height:44px;width:300px;border:1px solid var(--line);background:#f8fafc;border-radius:16px;color:#94a3b8;display:flex;align-items:center;padding:0 14px;font-size:14px}
.icon-btn{height:44px;min-width:44px;border:1px solid var(--line);border-radius:16px;background:white;display:flex;align-items:center;justify-content:center;font-weight:800}
.content{padding:28px 32px 40px}
.cards{display:grid;gap:18px;margin-bottom:26px}.cards.four{grid-template-columns:repeat(4,1fr)}.cards.three{grid-template-columns:repeat(3,1fr)}.cards.six{grid-template-columns:repeat(6,1fr)}
.card{background:white;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 8px 24px rgba(15,23,42,.04)}
.card.click{transition:.18s;text-align:left}.card.click:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(15,23,42,.09)}
.card-title{font-size:14px;color:var(--muted)}.card-value{font-size:38px;font-weight:900;margin-top:12px}
.pill{display:inline-flex;border:1px solid;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.pill.info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.pill.warn{background:#fffbeb;color:#b45309;border-color:#fde68a}.pill.danger{background:#fff1f2;color:#be123c;border-color:#fecdd3}.pill.success{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.pill.gray{background:#f8fafc;color:#475569;border-color:#e2e8f0}
.grid-2{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.grid-half{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.section-title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.section-title h2{margin:0;font-size:21px}.section-title p{margin:6px 0 0;color:var(--muted);font-size:14px}
.primary{border:0;background:#020617;color:white;border-radius:16px;padding:10px 16px;font-weight:900}.primary.green{background:#059669}.primary.blue{background:#2563eb}.primary.red{background:#e11d48}
.secondary{border:1px solid var(--line);background:white;color:#334155;border-radius:16px;padding:9px 14px;font-weight:800}
.state-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.state{border:0;background:#f8fafc;border-radius:18px;padding:18px;text-align:center}.state:hover{background:#eef2ff}.state b{font-size:26px}
.table-wrap{overflow:hidden;border:1px solid #e2e8f0;border-radius:20px;background:white}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:#f8fafc;color:#64748b;text-align:left;padding:14px 16px;font-weight:900}td{border-top:1px solid #f1f5f9;padding:15px 16px}tbody tr{cursor:pointer}tbody tr:hover{background:#f8fafc}
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:white;border-radius:16px;padding:10px 14px;color:#64748b}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{border:1px solid #e2e8f0;background:#f8fafc;border-radius:16px;padding:12px}.field label{display:block;font-size:12px;color:#64748b;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:0;background:transparent;outline:0;font-weight:800}.field.full{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:12px}.list-item{background:#f8fafc;border:0;border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}.list-item:hover{background:#eef2ff}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.lane{background:#f8fafc;border:1px solid #e2e8f0;border-radius:22px;padding:14px}.lane h3{margin:0 0 12px}.mini-card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{border:1px solid #e2e8f0;background:white;border-radius:999px;padding:10px 16px;font-weight:800}.tab.active{background:#020617;color:white}
.toast{position:fixed;left:50%;top:22px;z-index:99;transform:translateX(-50%);background:#020617;color:white;padding:12px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(15,23,42,.22);display:none;font-size:14px}.toast.show{display:block}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:80}.modal-mask.show{display:flex}
.modal{width:620px;max-width:calc(100vw - 40px);background:white;border-radius:28px;padding:24px;box-shadow:0 24px 80px rgba(15,23,42,.28)}.modal h2{margin:0 0 8px}.modal p{color:#64748b;line-height:1.7}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.drawer{position:fixed;right:-560px;top:0;height:100vh;width:540px;background:white;box-shadow:-20px 0 60px rgba(15,23,42,.25);z-index:90;transition:.25s;padding:26px;overflow:auto}.drawer.show{right:0}.drawer-row{display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9;padding:13px 0;font-size:14px}
.empty{height:320px;border:2px dashed #dbe3ee;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#94a3b8;background:white}
</style></head><body><div id="root"></div><script>
const $ = id => document.getElementById(id);
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2200)}
function setActive(key){document.querySelectorAll(".menu button").forEach(b=>b.classList.toggle("active",b.dataset.page===key))}
function openModal(title,body,ok="确认"){ $("modalTitle").innerHTML=title; $("modalBody").innerHTML=body; $("modalOk").textContent=ok; $("modal").classList.add("show"); $("modalOk").onclick=()=>{closeModal();toast(ok+"成功")} }
function closeModal(){ $("modal").classList.remove("show") }
function openDrawer(title, rows, actions=""){ $("drawerTitle").innerHTML=title; $("drawerBody").innerHTML=rows.map(r=>`<div class="drawer-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")+actions; $("drawer").classList.add("show") }
function closeDrawer(){ $("drawer").classList.remove("show") }
function searchBox(){openModal("搜索结果","<p>模拟搜索到：采购订单 PO20260508001、送货单 DL20260508001、供应商 上海拓明材料。</p>","打开结果")}
function modalShell(){return `<div id="toast" class="toast"></div><div id="modal" class="modal-mask" onclick="if(event.target.id==='modal')closeModal()"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button id="modalOk" class="primary">确认</button></div></div></div><div id="drawer" class="drawer"><button class="secondary" onclick="closeDrawer()" style="float:right">关闭</button><h2 id="drawerTitle"></h2><p class="muted">这里是模拟详情抽屉，可展示状态流、操作记录和下一步动作。</p><div id="drawerBody"></div></div>`}
